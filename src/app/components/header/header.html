<header class="flex justify-between p-8 h-20 items-center shadow-md">
    <h1 class="font-bold text-3xl text-zinc-800">Play <span class="text-indigo-600">Filmes</span></h1>

    <nav class="flex gap-10" id="nav">
        @for(link of links(); track link.id){
            <a [routerLink]="link.path"
            [id]="link.id" 
            routerLinkActive="active"
            #rla="routerLinkActive"
            [routerLinkActiveOptions]="{exact: true}"
            class="border-b-2 hover:border-gray-300 hover:text-gray-700"
            [ngClass]="{' border-transparent text-gray-500': !rla.isActive,
                        'border-indigo-500 text-gray-900': rla.isActive}"> 
            {{link.name}} </a>
        }
    </nav>
</header>
