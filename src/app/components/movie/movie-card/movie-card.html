<div class="max-w-sm md:max-w-2xl bg-white dark:bg-gray-800 rounded-xl shadow-lg overflow-hidden md:flex movie-card-zoom">
    <div class="md:shrink-0">
        <img class="h-64 w-full object-cover md:h-full md:w-48" 
                src="https://placehold.co/400x600/2D3748/FFFFFF?text=Poster" 
                alt="Poster do Filme 'Nome do Filme'">
    </div>
        
    <div class="p-6 md:p-8 flex flex-col justify-between">
        <div>
            <h1 class="text-2xl font-bold text-gray-900 dark:text-white mb-2">
                {{ movie()?.name }}
            </h1>
            
            <div class="flex justify-between items-center text-sm text-gray-600 dark:text-gray-400 mb-4">
                <span>
                    <strong>Lançamento:</strong> {{ movie()?.release_date | date:'dd/MM/yyyy' }}
                </span>
                <span>
                    <strong>Duração:</strong> {{ movie()?.duration_in_seconds }}
                </span>
            </div>

            <div>
                <h3 class="text-md font-semibold text-gray-800 dark:text-gray-200 mb-1">Sinopse</h3>
                <p class="text-gray-700 dark:text-gray-300 text-sm leading-relaxed">
                    {{ movie()?.synopsis }}
                </p>
            </div>
        </div>

        <div class="mt-6">
            <h3 class="text-md font-semibold text-gray-800 dark:text-gray-200 mb-1">Diretores</h3>
            <p class="text-gray-700 dark:text-gray-300 text-sm">
                {{ movie()?.director_names?.join(', ') }} 
            </p>
        </div>

        <div class="mt-6 flex justify-end space-x-3">
            <button class="flex items-center justify-center px-4 py-2 bg-blue-500 hover:bg-blue-600 text-white text-sm font-medium rounded-lg shadow-md transition-colors duration-200">
                <svg class="w-4 h-4 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15.232 5.232l3.536 3.536m-2.036-5.036a2.5 2.5 0 113.536 3.536L6.5 21.036H3v-3.536L16.732 3.732z"></path></svg>
                Editar
            </button>
            <button class="flex items-center justify-center px-4 py-2 bg-red-500 hover:bg-red-600 text-white text-sm font-medium rounded-lg shadow-md transition-colors duration-200">
                <svg class="w-4 h-4 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"></path></svg>
                Excluir
            </button>
        </div>
    </div>
</div>
