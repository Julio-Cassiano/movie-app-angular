<div class="bg-white dark:bg-gray-800 rounded-xl shadow-lg overflow-hidden max-w-md min-w-sm movie-card-zoom">
    <div class="">
        <img class="h-64 w-full object-cover" 
                [src]="movie()?.imagePath" 
                alt="Poster do Filme 'Nome do Filme'">
    </div>
        
    <div class="p-6 flex flex-col justify-between">
        <div>
            <h1 class="text-2xl font-bold text-gray-900 dark:text-white mb-2">
                {{ movie().name }}
            </h1>
            
            <div class="flex justify-between items-center text-sm text-gray-600 dark:text-gray-400 mb-4">
                <span>
                    <strong>Lançamento:</strong> {{ movie().releaseDate | date:'dd/MM/yyyy' }}
                </span>
                <span>
                    <strong>Duração:</strong> {{ movie().durationInSeconds }}
                </span>
            </div>

            <div>
                <h3 class="text-md font-semibold text-gray-800 dark:text-gray-200 mb-1">Sinopse</h3>
                <p class="text-gray-700 dark:text-gray-300 text-sm leading-relaxed">
                    {{ movie().synopsis }}
                </p>
            </div>
        </div>

        <div class="mt-6">
            <h3 class="text-md font-semibold text-gray-800 dark:text-gray-200 mb-1">Diretores</h3>
            <p class="text-gray-700 dark:text-gray-300 text-sm">
                {{ movie().directorNames.join(', ') }} 
            </p>
        </div>

        <div class="mt-6 flex justify-end space-x-3">
            <button buttonEdit (click)="editMovie(movie())"></button>
            <button buttonDelete></button>
        </div>
    </div>
</div>
