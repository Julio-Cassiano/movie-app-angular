@if(isEditingMovie()){
    <app-edit-movie-dialog/>
}
@if(isAddingMovie()){
    <app-edit-movie-dialog [create_movie]="true"/>
}
<div class="flex flex-col p-8">
    <div class="flex justify-between mb-12">
        <h1 class="text-shadow-neutral-900 font-medium text-2xl md:text-3xl lg:text-4xl">Gerenciamento de filmes</h1>
        <button class="cursor-pointer" buttonAdd content="Adicionar filme" (click)="createMovie()"></button>
    </div>

    <div class="grid grid-cols-1 m-auto md:grid-cols-2 lg:grid-cols-3 gap-10">
    @if(movies().length > 0){
        @for(movie of movies(); track movie.id) {
            <app-movie-card [movie]="movie" (deleteMovie)="onDelete($event)" (editMovie)="onEdit($event)"/>
        }
    } @else {
        <div class="m-auto">
            <h1 class="text-pink-600 text-7xl flex flex-col m-auto">Nenhum filme encontrado <span class="m-auto">⛅ ☔ 🌈 🌂 ⛄</span></h1>
        </div>
    }
    </div>
</div>
